<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Royal Club - Backend Status</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:#0a0a0b; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#1c1c1e; border-radius:20px; padding:32px 28px; max-width:440px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
  .logo { width:84px; height:84px; border-radius:22px; object-fit:cover; margin-bottom:14px; }
  h1 { font-size:22px; margin-bottom:6px; }
  p.sub { color:#86868b; font-size:13px; margin-bottom:18px; }
  .badge { display:inline-block; padding:8px 18px; border-radius:999px; font-size:14px; font-weight:700; margin-bottom:18px; }
  .badge.ok { background:rgba(52,199,89,0.15); color:#34c759; }
  .badge.bad { background:rgba(255,59,48,0.15); color:#ff3b30; }
  .row { background:#2c2c2e; border-radius:12px; padding:12px 14px; margin-bottom:10px; text-align:left; font-size:13px; }
  .row b { display:block; margin-bottom:4px; font-size:12px; color:#86868b; text-transform:uppercase; letter-spacing:0.5px; }
  .row .val { word-break:break-all; }
  .pass { color:#34c759; font-weight:700; }
  .fail { color:#ff3b30; font-weight:700; }
  button { width:100%; padding:13px; border:none; border-radius:12px; background:#007aff; color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; }
  button:active { opacity:0.8; }
  .time { margin-top:14px; font-size:11px; color:#636366; }
</style>
</head>
<body>
<div class="card">
  <h1>Ludo Royal Club</h1>
  <p class="sub">Backend Server</p>
  <div class="badge ok" id="main-badge">BACKEND WORKING</div>

  <div class="row"><b>API File</b><span class="val" id="t-api">checking...</span></div>
  <div class="row"><b>Database</b><span class="val" id="t-db">checking...</span></div>
  <div class="row"><b>Firebase Config</b><span class="val" id="t-fb">checking...</span></div>

  <button onclick="runCheck()">Recheck Status</button>
  <div class="time" id="t-time"></div>
</div>

<script>
async function runCheck() {
  document.getElementById('t-time').textContent = 'Last check: ' + new Date().toLocaleString();
  set('t-api', 'checking...', ''); set('t-db', 'checking...', ''); set('t-fb', 'checking...', '');
  let allOk = true;

  // 1. Firebase config (DB ki zaroorat nahi — api.php + firebase_config.php ka test)
  try {
    const r = await fetch('api.php?action=getFirebaseConfig');
    const j = await r.json();
    if (j.success && j.config && j.config.projectId) set('t-fb', 'OK (' + j.config.projectId + ')', true);
    else { set('t-fb', 'FAIL: ' + (j.error || 'bad response'), false); allOk = false; }
  } catch (e) { set('t-fb', 'FAIL: api.php nahi mila (' + e.message + ')', false); allOk = false; }

  // 2. Database (getGames ko DB chahiye — chala to DB connected)
  try {
    const r = await fetch('api.php?action=getGames');
    const j = await r.json();
    if (j.success) set('t-db', 'OK (connected)', true);
    else { set('t-db', 'FAIL: ' + (j.error || 'DB error'), false); allOk = false; }
  } catch (e) { set('t-db', 'FAIL: ' + e.message, false); allOk = false; }

  // 3. API file (upar wale dono me se ek bhi chala = api.php zinda hai)
  const fbOk = document.getElementById('t-fb').className.includes('pass');
  const dbOk = document.getElementById('t-db').className.includes('pass');
  if (fbOk || dbOk) set('t-api', 'OK (api.php live)', true);
  else { set('t-api', 'FAIL', false); allOk = false; }

  const b = document.getElementById('main-badge');
  b.textContent = allOk ? 'BACKEND WORKING' : 'BACKEND ME PROBLEM HAI';
  b.className = 'badge ' + (allOk ? 'ok' : 'bad');
}
function set(id, txt, ok) {
  const el = document.getElementById(id);
  el.innerHTML = '<span class="' + (ok === true ? 'pass' : ok === false ? 'fail' : '') + '">' + txt + '</span>';
}
runCheck();
</script>
</body>
</html>
